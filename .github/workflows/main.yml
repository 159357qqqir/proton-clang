name: Get Proton Clang aarch64
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone prebuilt Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang

      - name: Package
        run: |
          tar -Jcf proton-clang-aarch64.tar.xz proton-clang

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-clang-aarch64
          path: proton-clang-aarch64.tar.xz
