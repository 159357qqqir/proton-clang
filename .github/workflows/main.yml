name: Build Proton Clang aarch64
on:
  workflow_dispatch: # 手动触发，自己点按钮编译

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build gcc g++ git python3 libstdc++-12-dev crossbuild-essential-arm64

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build LLVM/Clang for aarch64-linux-gnu
        run: |
          mkdir build
          cd build
          cmake -G Ninja ../llvm \
            -DLLVM_ENABLE_PROJECTS="clang;lld;compiler-rt;libcxx;libcxxabi" \
            -DCMAKE_CROSSCOMPILING=ON \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_INSTALL_PREFIX=$PWD/install \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-linux-gnu \
            -DLLVM_ENABLE_LTO=OFF
          ninja
          ninja install

      - name: Package toolchain
        run: |
          cd build/install
          tar -Jcf ../proton-clang-aarch64.tar.xz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-clang-aarch64
          path: build/proton-clang-aarch64.tar.xz
